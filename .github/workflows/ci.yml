name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Pinned browser image: visual snapshots are rendered here, so text rasterizes the same on every run.
    # Keep the tag in step with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 30
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tokens, dist, bundle, manifest, llms.txt, framework types)
        run: npm run build

      - name: Component tests
        run: npx playwright test

      - name: Framework examples (build + typecheck + smoke tests)
        run: |
          npm run examples:build
          npm run examples:typecheck
          npx playwright test -c playwright.frameworks.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload package build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trompe-dist
          path: |
            dist/
            custom-elements.json
            llms.txt
            llms-full.txt
          retention-days: 7
