<!doctype html>
<html><head><meta charset="utf-8"><script type="module" src="/src/index.ts"></script>
<style>body{margin:0;padding:24px;background:var(--tr-color-canvas);color:var(--tr-color-ink);font-family:system-ui;font-size:28px}
.row{display:flex;gap:28px;padding:20px;background:var(--tr-color-canvas)}</style></head>
<body><div class="row">
<tr-slider orientation="vertical" label="Kick" value="50" hide-value ticks="5" material="rubber" style="--tr-slider-length:6em"></tr-slider>
<tr-slider orientation="vertical" label="Hat" value="50" hide-value ticks="5" style="--tr-slider-length:6em"></tr-slider>
<tr-slider orientation="vertical" label="Bass" value="50" hide-value ticks="5" material="metal" style="--tr-slider-length:6em"></tr-slider>
<tr-slider orientation="vertical" label="Chr" value="50" hide-value ticks="5" material="chrome" style="--tr-slider-length:6em"></tr-slider>
<tr-slider orientation="vertical" label="Red" value="50" hide-value ticks="5" realism="real" style="--tr-slider-length:6em;--tr-slider-cap-color:oklch(55% 0.19 25);--tr-slider-cap-line-color:white"></tr-slider>
</div>
<div class="row" data-tr-theme="dark">
<tr-slider orientation="vertical" label="Kick" value="50" hide-value ticks="5" material="rubber" style="--tr-slider-length:6em"></tr-slider>
<tr-slider orientation="vertical" label="Hat" value="50" hide-value ticks="5" style="--tr-slider-length:6em"></tr-slider>
<tr-slider orientation="vertical" label="Bass" value="50" hide-value ticks="5" material="metal" style="--tr-slider-length:6em"></tr-slider>
</div></body></html>
