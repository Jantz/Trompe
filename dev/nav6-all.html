<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<script type="module" src="/src/index.ts"></script>
<link rel="stylesheet" href="/src/generated/skins.css">
<style>body{margin:0;background:var(--tr-color-canvas);color:var(--tr-color-ink);font-family:system-ui}
.sec{padding:20px;background:var(--tr-color-canvas);color:var(--tr-color-ink);display:grid;grid-template-columns:220px 1fr 1fr;gap:20px;align-items:start}
.col{display:grid;gap:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
svg.i{width:18px;height:18px}</style></head>
<body>
<svg style="display:none"><symbol id="home" viewBox="0 0 20 20"><path d="M3 9l7-6 7 6v8h-5v-5H8v5H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
<symbol id="inbox" viewBox="0 0 20 20"><path d="M3 11l2-7h10l2 7v5H3zM3 11h4l1 2h4l1-2h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
<symbol id="gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M4.3 15.7l2.1-2.1M13.6 6.4l2.1-2.1" stroke="currentColor" stroke-width="1.6"/></symbol></svg>
<script>
const ic = (id) => `<svg class="i" slot="icon"><use href="#${id}"/></svg>`;
const nav = `<tr-nav label="Main"><div slot="header" style="font-weight:700;padding:.2em .4em">Acme</div>
<tr-nav-item href="#" current>${ic('home')}Dashboard</tr-nav-item>
<tr-nav-item href="#">${ic('inbox')}Inbox<tr-badge slot="badge" tone="accent">12</tr-badge></tr-nav-item>
<tr-nav-item>${ic('gear')}Projects<tr-nav-item href="#">Alpha</tr-nav-item><tr-nav-item href="#">Beta</tr-nav-item></tr-nav-item>
<h3>Team</h3><tr-nav-item href="#">Members</tr-nav-item><tr-nav-item href="#">Settings</tr-nav-item></tr-nav>`;
const badges = `<div class="row"><tr-badge>Draft</tr-badge><tr-badge tone="accent">12</tr-badge><tr-badge tone="success" dot>Online</tr-badge><tr-badge tone="warning">Pending</tr-badge><tr-badge tone="danger" dot>Failed</tr-badge></div>
<div class="row"><tr-badge variant="plate">v2.4</tr-badge><tr-badge variant="plate" tone="success">Pass</tr-badge><tr-badge variant="plate" tone="danger" material="metal">Recall</tr-badge><tr-badge variant="well" tone="accent">Beta</tr-badge><tr-badge variant="well" tone="success" dot>Live</tr-badge><tr-badge variant="well">Archived</tr-badge></div>`;
const progress = `<tr-progress label="Uploading photos" value="62" show-value></tr-progress><tr-progress label="Syncing" ></tr-progress>
<div class="row"><tr-progress variant="ring" value="72" show-value label="Storage"></tr-progress><tr-progress variant="ring" value="30" show-value tone="success" label="CPU" size="sm"></tr-progress><tr-progress variant="ring" size="lg" value="88" show-value tone="danger" label="Quota"></tr-progress><tr-progress variant="ring" label="Loading" size="sm"></tr-progress></div>`;
const toolbar = `<tr-toolbar label="Formatting"><tr-button toggle pressed size="sm" aria-label="Bold"><b>B</b></tr-button><tr-button toggle size="sm" aria-label="Italic"><i>I</i></tr-button><tr-button toggle size="sm" aria-label="Underline"><u>U</u></tr-button><hr><tr-button size="sm">Insert</tr-button><tr-input size="sm" aria-label="Search" placeholder="Search"></tr-input></tr-toolbar>
<tr-toolbar variant="bar" label="Actions"><tr-button size="sm">Reply</tr-button><tr-button size="sm">Forward</tr-button><hr><tr-button size="sm" tone="danger">Delete</tr-button></tr-toolbar>`;
const list = `<tr-list label="Account"><tr-list-item><svg slot="start" class="i"><use href="#inbox"/></svg>Email<span slot="description">ada@example.com</span><tr-button slot="end" size="sm">Change</tr-button></tr-list-item>
<tr-list-item><svg slot="start" class="i"><use href="#gear"/></svg>Notifications<span slot="description">Push and email</span><tr-switch slot="end" checked aria-label="Notifications"></tr-switch></tr-list-item>
<tr-list-item>Plan<tr-badge slot="end" tone="accent">Pro</tr-badge></tr-list-item></tr-list>
<tr-list selectable label="Files" variant="card" value="Plan.md"><tr-list-item>Notes.md<span slot="end">4 KB</span></tr-list-item><tr-list-item>Plan.md<span slot="end">2 KB</span></tr-list-item><tr-list-item>Budget.xlsx<span slot="end">18 KB</span></tr-list-item></tr-list>`;
const tabs = `<tr-tabs label="Settings"><tr-tab>General</tr-tab><tr-tab selected>Privacy</tr-tab><tr-tab>Alerts <tr-badge slot="end" tone="accent">3</tr-badge></tr-tab>
<tr-tab-panel>General</tr-tab-panel><tr-tab-panel>Privacy controls for your profile.</tr-tab-panel><tr-tab-panel>Alerts</tr-tab-panel></tr-tabs>`;
const q = new URLSearchParams(location.search);
const skins = q.get('s') ? q.get('s').split(',').map(x=>x.split(':')) : [['', 'light'], ['', 'dark'], ['studio',''], ['chrome',''], ['heritage',''], ['soft',''], ['aurora','']];
for (const [skin, theme] of skins) {
  document.write(`<div class="sec" ${skin?`data-tr-skin="${skin}"`:''} ${theme?`data-tr-theme="${theme}"`:''} ${q.get('r')?`data-tr-realism="${q.get('r')}"`:''}>${nav}<div class="col">${tabs}${toolbar}${badges}</div><div class="col">${progress}${list}</div></div>`);
}
</script>
</body></html>
