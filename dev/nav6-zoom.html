<!doctype html>
<html><head><meta charset="utf-8"><script type="module" src="/src/index.ts"></script>
<link rel="stylesheet" href="/src/generated/skins.css">
<style>body{margin:0;background:var(--tr-color-canvas);color:var(--tr-color-ink);font-family:system-ui}.sec{padding:20px;background:var(--tr-color-canvas);display:grid;gap:20px}</style></head>
<body><script>
const q = new URLSearchParams(location.search);
document.write(`<div class="sec" ${q.get('skin')?`data-tr-skin="${q.get('skin')}"`:''} ${q.get('theme')?`data-tr-theme="${q.get('theme')}"`:''}>${decodeURIComponent(q.get('m')||'')}</div>`);
</script></body></html>
