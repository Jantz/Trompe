<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<script type="module" src="/src/index.ts"></script>
<style>body{margin:0;padding:24px;background:var(--tr-color-canvas);color:var(--tr-color-ink);font-family:system-ui;display:grid;gap:12px}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:18px;background:var(--tr-color-canvas)}
</style></head>
<body>
<div class="row">
<div style="display:grid;gap:8px"><tr-meter label="L" value="0.62" peak></tr-meter><tr-meter label="R" value="0.95" segments="24"></tr-meter><tr-meter label="M" value="0.3" style="width:20em" segments="40"></tr-meter><tr-meter label="Battery" value="0.15" segments="5" invert style="width:5em"></tr-meter><tr-meter label="Strength" value="0.7" segments="4" invert style="width:6em"></tr-meter></div>
<tr-meter label="V" value="0.8" orientation="vertical" peak></tr-meter>
<tr-meter id="sp" mode="spectrum" bands="16" segments="10" label="Spectrum" peak values="0.2,0.4,0.6,0.8,0.95,1,0.85,0.7,0.6,0.5,0.45,0.4,0.3,0.25,0.15,0.1"></tr-meter>
</div>
<div class="row" data-tr-theme="dark">
<div style="display:grid;gap:8px"><tr-meter label="L" value="0.62" peak></tr-meter><tr-meter label="R" value="0.95" segments="24"></tr-meter></div>
<tr-meter label="V" value="0.8" orientation="vertical"></tr-meter>
<tr-meter mode="spectrum" bands="24" segments="14" label="Spectrum" realism="real" values="0.3,0.5,0.7,0.9,0.95,1,0.85,0.7,0.6,0.5,0.45,0.4,0.3,0.25,0.15,0.1,0.2,0.3,0.4,0.3,0.2,0.1,0.05,0.02"></tr-meter>
</div>
<script type="module">
await customElements.whenDefined('tr-meter');
const anim = new URLSearchParams(location.search).has('anim');
if (anim) { const m=[...document.querySelectorAll('tr-meter')]; let t0=performance.now();
 const loop=(t)=>{ for(const el of m){ if(el.mode==='spectrum'){ const n=el.bands; el.values=Array.from({length:n},(_,i)=>0.5+0.5*Math.sin(t/300+i*0.6)*Math.cos(t/900+i)); } else el.value=0.5+0.45*Math.sin(t/200); } requestAnimationFrame(loop)}; requestAnimationFrame(loop); }
</script>
</body></html>
