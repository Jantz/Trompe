<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<script type="module" src="../src/components/button/button.ts"></script>
<style>body{margin:0;padding:24px;background:var(--tr-color-canvas);color:var(--tr-color-ink);font-family:system-ui;display:grid;gap:20px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style></head>
<body>
<svg style="display:none"><symbol id="play" viewBox="0 0 16 16"><path fill="currentColor" d="M4 2l10 6-10 6z"/></symbol></svg>
<div class="row"><tr-button>Neutral</tr-button><tr-button tone="accent">Accent</tr-button><tr-button tone="danger">Delete</tr-button><tr-button toggle pressed>Mute</tr-button><tr-button disabled>Disabled</tr-button><tr-button shape="pill">Pill</tr-button></div>
<div class="row"><tr-button material="metal">Metal</tr-button><tr-button material="chrome">Chrome</tr-button><tr-button material="rubber">Rubber</tr-button><tr-button material="paper">Paper</tr-button><tr-button material="metal" tone="accent">Anodized</tr-button><tr-button finish="gloss" tone="accent" shape="pill" profile="convex">Candy</tr-button><tr-button finish="gloss" material="rubber" shape="pill">Gloss black</tr-button></div>
<div class="row"><tr-button profile="flat">flat</tr-button><tr-button profile="convex">convex</tr-button><tr-button profile="concave">concave</tr-button><tr-button profile="bevel" material="metal">bevel</tr-button><tr-button profile="dome" shape="circle" aria-label="Play"><svg width="14" height="14"><use href="#play"/></svg></tr-button><tr-button profile="dome" shape="circle" finish="gloss" tone="accent" size="lg" aria-label="Play"><svg width="16" height="16"><use href="#play"/></svg></tr-button><tr-button profile="dome" shape="circle" material="chrome" size="lg" aria-label="Play"><svg width="16" height="16"><use href="#play"/></svg></tr-button><tr-button shape="circle" finish="spun" material="metal" size="lg" aria-label="Play"><svg width="16" height="16"><use href="#play"/></svg></tr-button></div>
<div class="row"><tr-button realism="flat">Flat</tr-button><tr-button realism="soft">Soft</tr-button><tr-button realism="tactile">Tactile</tr-button><tr-button realism="real" material="chrome" profile="bevel">Real chrome</tr-button><tr-button realism="real" finish="gloss" tone="accent">Real gloss</tr-button></div>
<div class="row" data-tr-theme="dark" style="background:var(--tr-color-canvas);padding:20px"><tr-button>Neutral</tr-button><tr-button tone="accent" finish="gloss">Accent</tr-button><tr-button toggle pressed>Mute</tr-button><tr-button material="metal">Metal</tr-button><tr-button material="chrome">Chrome</tr-button><tr-button material="rubber" finish="gloss" shape="circle" profile="dome" aria-label="Play"><svg width="14" height="14"><use href="#play"/></svg></tr-button></div>
</body></html>
